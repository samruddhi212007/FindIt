<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FindIt — Campus Lost & Found</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#14213d;--mut:#5b6479;--line:#e4e8f0;--navy:#14213d;--teal:#0f9aa0;--teald:#0b7479;--sky:#e6f3fa;--lost:#b4432f;--lostb:#fdebe6;--found:#0b7a55;--foundb:#e3f6ee;--sh:0 4px 18px rgba(20,33,61,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--ink:#eef1f8;--mut:#a5aec4;--line:#2a3452;--navy:#eef1f8;--teal:#3cc7cd;--teald:#5fd8dd;--sky:#1a2a45;--lost:#ff9a85;--lostb:#3a2022;--found:#6fe0b0;--foundb:#16342a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
a,button{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}.nav{display:flex;align-items:center;gap:6px;height:62px}
.logo{font-weight:800;font-size:20px;color:var(--ink);margin-right:auto;cursor:pointer;background:none;border:0}
.nav button.l{background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--mut);font-weight:600}.nav button.l:hover,.nav button.l.on{background:var(--sky);color:var(--ink)}
#burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink)}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--teal);color:#04282a;transition:.15s}.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn.s{background:var(--sky);color:var(--ink)}.btn.o{background:none;border:1.5px solid var(--line);color:var(--ink)}.btn.d{background:var(--lostb);color:var(--lost)}.btn.sm{padding:6px 12px;font-size:13px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:54px 0 26px}
h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:0 0 14px;letter-spacing:-.02em;font-weight:800}h2{margin:0 0 6px;font-size:26px}h3{margin:0}
.mut{color:var(--mut)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.search{display:flex;gap:8px;padding:8px;margin-top:16px}.search input{flex:1;border:0;background:none;padding:10px 12px;color:var(--ink);font-size:16px;min-width:0}.search input:focus{outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px}.chip.on{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.item{overflow:hidden;display:flex;flex-direction:column;transition:.2s}.item:hover{transform:translateY(-3px)}.item img{width:100%;height:150px;object-fit:cover;display:block;background:var(--sky)}
.item .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.badge.lost{background:var(--lostb);color:var(--lost)}.badge.found{background:var(--foundb);color:var(--found)}.badge.re{background:var(--sky);color:var(--teald)}
.meta{font-size:13px;color:var(--mut)}.sk{height:270px;border-radius:18px;background:linear-gradient(90deg,var(--line),var(--sky),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}.err{color:var(--lost);font-size:12px;min-height:14px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}.drop.hv{border-color:var(--teal);background:var(--sky)}.drop img{max-height:170px;border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.det{display:grid;grid-template-columns:1fr 1fr;gap:26px}.det img{width:100%;border-radius:18px;max-height:420px;object-fit:cover}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.rep{display:flex;gap:14px;padding:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.rep img{width:64px;height:64px;border-radius:12px;object-fit:cover}.rep .x{flex:1;min-width:160px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0}.stat{padding:16px}.stat b{font-size:28px;display:block}
.empty{text-align:center;padding:44px 16px;color:var(--mut)}.empty .em{font-size:52px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px}.toast{background:var(--navy);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:var(--sh);font-weight:600;animation:up .25s}.toast.e{background:var(--lost);color:#fff}@keyframes up{from{opacity:0;transform:translateY(8px)}}
dialog{border:0;border-radius:18px;padding:22px;max-width:480px;width:92%;background:var(--card);color:var(--ink);box-shadow:var(--sh)}dialog::backdrop{background:rgba(10,15,30,.5)}
.msg{padding:8px 12px;border-radius:12px;background:var(--sky);margin:6px 0;max-width:85%}.msg.me{background:var(--teal);color:#04282a;margin-left:auto}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
footer{text-align:center;padding:40px 0;color:var(--mut)}
@media(max-width:760px){.hero,.det,.two{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}#burger{display:block}.nav .links{display:none;position:absolute;top:62px;left:0;right:0;flex-direction:column;background:var(--card);padding:10px;border-bottom:1px solid var(--line)}.nav .links.open{display:flex}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="wrap nav"><button class="logo" onclick="go('home')">FindIt 🎯</button><button id="burger" aria-label="Menu" onclick="document.querySelector('.links').classList.toggle('open')">☰</button><div class="links row" id="links"></div></div></header>
<main class="wrap" id="app" aria-live="polite"></main><footer>FindIt · Lost on campus. Found together.</footer><div id="toasts"></div>
<dialog id="dlg"></dialog>
<script>
const CATS=['Electronics','ID Cards','Books & Notes','Accessories','Water Bottles','Other'],EMO={'Electronics':'🎧','ID Cards':'🪪','Books & Notes':'📓','Accessories':'🧮','Water Bottles':'🍶','Other':'💾'};
const LOCS=['Main Library','Central Canteen','Engineering Block','Admin Building','Sports Complex','Bus Stop / Gate 2','Auditorium','Hostel Area'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function art(cat,seed){const h=[190,170,210,160,200,180][CATS.indexOf(cat)%6]||190;return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240"><rect width="400" height="240" fill="hsl(${h},60%,90%)"/><circle cx="330" cy="40" r="70" fill="hsl(${h},60%,84%)"/><text x="200" y="145" font-size="92" text-anchor="middle">${EMO[cat]||'📦'}</text></svg>`)}
const d=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const SAMPLE=[['Student ID Card','ID Cards','lost',1,'Main Library','Blue lanyard, name Aarav S., CSE 2nd year. Last seen near the reading hall.'],['Wireless Earbuds','Electronics','found',1,'Central Canteen','White earbuds in a small charging case, found on a table near the juice counter.'],['Engineering Mathematics Notebook','Books & Notes','lost',2,'Engineering Block','Green spiral notebook with handwritten Unit 3 notes and a doodle on the cover.'],['Black Water Bottle','Water Bottles','found',3,'Sports Complex','Matte black steel bottle with a dented base and a football sticker.'],['Scientific Calculator','Accessories','lost',4,'Auditorium','Casio fx-991 with initials “KR” on the back. Left after the exam seminar.'],['USB Drive','Other','found',5,'Admin Building','16GB silver pen drive with a red keyring, found at the fee counter.']].map((s,i)=>({id:'s'+i,title:s[0],cat:s[1],type:s[2],date:d(s[3]),loc:s[4],desc:s[5],img:art(s[1]),owner:'seed',ownerName:'Campus Volunteer',status:'active',contact:'in-app',created:Date.now()-s[3]*864e5,q:s[2]==='found'?'What colour is the item and any marks on it?':''}));
let db=null,user=null,me={id:'guest',name:'You'},admin=false,R=[],C=[],USERS={},view='home',sel=null,filt={q:'',cat:'All Items',type:'',loc:'',sort:'new'},loaded=false,edit=null,img='',tab='all';
const toast=(m,e)=>{const t=document.createElement('div');t.className='toast'+(e?' e':'');t.textContent=m;t.setAttribute('role',e?'alert':'status');$('#toasts').append(t);setTimeout(()=>t.remove(),3500)};
async function save(col,o){const arr=col==='reports'?R:C,i=arr.findIndex(x=>x.id===o.id);i<0?arr.unshift(o):arr[i]=o;if(db)try{await db.collection(col).doc(o.id).set(o)}catch(e){toast('Could not save: '+(e.message||e.code),1);return false}render();return true}
async function del(col,id){const k=col==='reports'?'R':'C';if(k==='R')R=R.filter(x=>x.id!==id);else C=C.filter(x=>x.id!==id);if(db)try{await db.collection(col).doc(id).delete()}catch(e){toast('Could not delete',1)}render()}
async function init(){
 R=SAMPLE.slice();render();
 try{const cl=window.claude;user=cl&&await cl.use('user');db=cl&&await cl.use('db');}catch(e){}
 if(user){try{const m=await user.me();me={id:m.id||'u',name:m.name||'Student'};admin=user.canEdit()||user.isOwner()}catch(e){}}
 if(!db){loaded=true;render();toast('Demo mode: data stays in this tab');return}
 let t=setTimeout(()=>{loaded=true;render()},8000);
 db.collection('reports').onSnapshot(async s=>{clearTimeout(t);loaded=true;if(s.empty&&admin&&!window.seeded){window.seeded=1;SAMPLE.forEach(x=>db.collection('reports').doc(x.id).set(x));return}R=s.docs.map(x=>x.data());if(s.empty)R=SAMPLE.slice();render()},e=>{loaded=true;toast('Live updates unavailable',1);render()});
 db.collection('claims').onSnapshot(s=>{C=s.docs.map(x=>x.data());render()},()=>{});
}
function go(v,id){view=v;sel=id||null;edit=null;img='';document.querySelector('.links').classList.remove('open');render();scrollTo(0,0)}
function nav(){const L=[['home','Home'],['browse','Browse Items'],['report','Report Lost',1],['report','Report Found',2],['mine','My Reports']];if(admin)L.push(['admin','Admin']);
 $('#links').innerHTML=L.map(l=>`<button class="l ${view===l[0]&&!l[2]||0?'on':''}" onclick="${l[2]?`go('report');setTimeout(()=>{$('#f-type').value='${l[2]==1?'lost':'found'}'},0)`:`go('${l[0]}')`}">${l[1]}</button>`).join('')+`<button class="btn s sm" onclick="profile()" aria-label="Profile">${avatar()} ${user?esc(me.name.split(' ')[0]):'Sign In'}</button>`}
const avatar=()=>`<span style="display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--teal);color:#04282a;font-weight:800;font-size:12px">${esc((me.name||'G')[0].toUpperCase())}</span>`;
function profile(){const dl=$('#dlg');dl.innerHTML=user?`<h3>${avatar()} ${esc(me.name)}</h3><p class="mut">Signed in with your college account via claude.ai. Role: <b>${admin?'Admin':'Student'}</b>. Sign-in, sign-up and password reset are handled by that account, so your password is never stored by FindIt.</p><div class="row"><button class="btn" onclick="go('mine');dlg.close()">My Reports</button><button class="btn o" onclick="dlg.close()">Close</button></div>`:`<h3>Sign in</h3><p class="mut">Open this page signed in to claude.ai with your college email to post, claim and manage reports. You're browsing in demo mode.</p><button class="btn" onclick="dlg.close()">OK</button>`;dl.showModal()}
const badge=r=>r.status==='reunited'?'<span class="badge re">Reunited ✓</span>':`<span class="badge ${r.type}">${r.type==='lost'?'Lost':'Found'}</span>`;
function card(r){return `<article class="card item"><img src="${r.img}" alt="${esc(r.title)}" loading="lazy"><div class="b"><div class="row" style="justify-content:space-between">${badge(r)}<span class="meta">${esc(r.cat)}</span></div><h3>${esc(r.title)}</h3><div class="meta">📍 ${esc(r.loc)} · ${esc(r.date)}</div><div class="meta" style="flex:1">${esc(r.desc.slice(0,90))}${r.desc.length>90?'…':''}</div><button class="btn s sm" onclick="go('item','${r.id}')">View Details</button></div></article>`}
function filtered(){let a=R.filter(r=>r.status!=='removed');const f=filt,q=f.q.toLowerCase();a=a.filter(r=>(!q||(r.title+r.desc).toLowerCase().includes(q))&&(f.cat==='All Items'||r.cat===f.cat)&&(!f.type||r.type===f.type)&&(!f.loc||r.loc===f.loc));return a.sort((x,y)=>f.sort==='old'?x.created-y.created:y.created-x.created)}
const chips=()=>['All Items',...CATS].map(c=>`<button class="chip ${filt.cat===c?'on':''}" onclick="filt.cat='${c}';render()">${c}</button>`).join('');
const grid=a=>!loaded?'<div class="grid">'+'<div class="sk"></div>'.repeat(6)+'</div>':a.length?`<div class="grid">${a.map(card).join('')}</div>`:`<div class="empty"><div class="em">🔎</div><h3>Nothing matches yet</h3><p>Try different filters, or report it so others can help.</p><button class="btn" onclick="go('report')">Report an Item</button></div>`;
const V={
home:()=>`<section class="hero"><div><h1>Lost something on campus? Let's find it.</h1><p class="mut" style="font-size:17px">Your campus belongings deserve a second chance. Report lost items, discover found belongings, and help your college community reunite with what matters.</p><div class="row" style="margin-top:18px"><button class="btn" onclick="go('browse')">Find an Item</button><button class="btn o" onclick="go('report')">Report an Item</button></div></div>
<svg viewBox="0 0 360 260" role="img" aria-label="Two students returning a lost bag"><rect width="360" height="260" rx="28" fill="var(--sky)"/><circle cx="290" cy="50" r="38" fill="var(--teal)" opacity=".25"/><rect x="0" y="210" width="360" height="50" fill="var(--teal)" opacity=".18"/><g><circle cx="110" cy="100" r="24" fill="#f2c9a0"/><rect x="82" y="124" width="56" height="86" rx="22" fill="var(--navy)"/><path d="M84 96q26-34 52 0" fill="#3b2a20"/></g><g><circle cx="250" cy="100" r="24" fill="#d9a77a"/><rect x="222" y="124" width="56" height="86" rx="22" fill="var(--teal)"/><path d="M226 96q24-36 48 0" fill="#1b1b1b"/></g><rect x="160" y="150" width="40" height="32" rx="8" fill="#f5b942"/><path d="M168 150v-8q12-10 24 0v8" stroke="#8a5a00" stroke-width="4" fill="none"/><path d="M135 150l24 10M225 150l-24 10" stroke="var(--navy)" stroke-width="10" stroke-linecap="round"/><text x="180" y="58" font-size="30" text-anchor="middle">🎯</text></svg></section>
<div class="card search"><input id="hq" placeholder="Search for keys, ID cards, books, earbuds..." aria-label="Search items" value="${esc(filt.q)}" onkeydown="if(event.key==='Enter')hs()"><button class="btn" onclick="hs()">Search</button></div><div class="chips">${chips()}</div>
<h2 style="margin-top:24px">Recently reported</h2><p class="mut">Lost on campus. Found together.</p>${grid(filtered().slice(0,6))}<div style="text-align:center;margin:20px"><button class="btn s" onclick="go('browse')">See all items →</button></div>`,
browse:()=>{const a=filtered();return `<h2 style="margin-top:26px">Browse Items</h2><p class="mut">${loaded?a.length+' reports':'Loading…'}</p><div class="filters"><input placeholder="Search name or description" aria-label="Search" value="${esc(filt.q)}" oninput="filt.q=this.value;clearTimeout(window.tq);window.tq=setTimeout(()=>{render();$('#app input')?.focus()},300)"><select aria-label="Status" onchange="filt.type=this.value;render()"><option value="">Lost &amp; Found</option><option value="lost" ${filt.type==='lost'?'selected':''}>Lost</option><option value="found" ${filt.type==='found'?'selected':''}>Found</option></select><select aria-label="Location" onchange="filt.loc=this.value;render()"><option value="">All locations</option>${LOCS.map(l=>`<option ${filt.loc===l?'selected':''}>${l}</option>`).join('')}</select><select aria-label="Sort" onchange="filt.sort=this.value;render()"><option value="new">Newest first</option><option value="old" ${filt.sort==='old'?'selected':''}>Oldest first</option></select></div><div class="chips">${chips()}</div>${grid(a)}`},
report:()=>{const e=edit||{};return `<h2 style="margin-top:26px">${edit?'Edit report':'Report an item'}</h2><p class="mut">The more detail, the faster it finds its way home. Your email and phone are never shown publicly.</p><form class="card" style="padding:22px;max-width:720px" onsubmit="return submitR(event)" novalidate>
<div class="two"><div><label for="f-type">I… *</label><select id="f-type"><option value="lost" ${e.type==='lost'?'selected':''}>Lost an item</option><option value="found" ${e.type==='found'?'selected':''}>Found an item</option></select></div><div><label for="f-cat">Category *</label><select id="f-cat">${CATS.map(c=>`<option ${e.cat===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
<label for="f-title">Item name *</label><input id="f-title" placeholder="e.g. Blue Casio calculator" value="${esc(e.title)}"><div class="err" id="e-title"></div>
<div class="two"><div><label for="f-date">Date *</label><input type="date" id="f-date" max="${d(0)}" value="${e.date||d(0)}"></div><div><label for="f-loc">Approximate location *</label><input id="f-loc" list="locs" placeholder="e.g. Main Library, 2nd floor" value="${esc(e.loc)}"><datalist id="locs">${LOCS.map(l=>`<option>${l}</option>`).join('')}</datalist><div class="err" id="e-loc"></div></div></div>
<label for="f-desc">Description *</label><textarea id="f-desc" rows="3" placeholder="Colour, brand, marks, stickers… (leave one detail out for ownership checks)">${esc(e.desc)}</textarea><div class="err" id="e-desc"></div>
<label for="f-q">Verification question (optional)</label><input id="f-q" placeholder="e.g. What sticker is on the back?" value="${esc(e.q)}">
<label>Photo</label><div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload image" onclick="$('#file').click()" onkeydown="if(event.key==='Enter')$('#file').click()">${img||e.img&&!e.img.startsWith('data:image/svg')?`<img src="${img||e.img}" alt="Preview">`:'📷 Drag &amp; drop an image or click to browse'}</div><input type="file" id="file" accept="image/*" hidden>
<label for="f-contact">Contact preference</label><select id="f-contact"><option value="in-app">In-app claims only (recommended)</option><option value="campus-email" ${e.contact==='campus-email'?'selected':''}>Share my college email after I approve a claim</option></select>
<div class="row" style="margin-top:18px"><button class="btn" id="sub">${edit?'Save changes':'Submit report'}</button><button type="button" class="btn o" onclick="go('mine')">Cancel</button></div></form>`},
item:()=>{const r=R.find(x=>x.id===sel);if(!r)return '<div class="empty"><div class="em">🫥</div><p>That report no longer exists.</p><button class="btn" onclick="go(\'browse\')">Back to browse</button></div>';const own=r.owner===me.id,cl=C.filter(c=>c.rid===r.id),mine=cl.filter(c=>c.by===me.id);
return `<p style="margin-top:20px"><button class="btn o sm" onclick="go('browse')">← Back</button></p><div class="det"><img src="${r.img}" alt="${esc(r.title)}"><div>${badge(r)}<h1 style="font-size:32px;margin-top:8px">${esc(r.title)}</h1><p class="meta">${esc(r.cat)} · 📍 ${esc(r.loc)} · ${esc(r.date)} · Posted by ${esc(r.ownerName||'a student')}</p><p>${esc(r.desc)}</p><div class="row">${r.status==='reunited'?'<span class="mut">This item has been reunited 🎉</span>':own?`<button class="btn" onclick="reunite('${r.id}')">Mark as Reunited</button><button class="btn s" onclick="editR('${r.id}')">Edit</button>`:r.type==='lost'?`<button class="btn" onclick="claim('${r.id}')">I Think This Is Mine</button>`:`<button class="btn" onclick="claim('${r.id}')">Contact Finder</button>`}</div><p class="meta">🔒 Contact details are never shown. Messages go through FindIt.</p></div></div>
<h3 style="margin-top:26px">${own?'Claims on this report':'Your messages'}</h3>${(own?cl:mine).map(cview).join('')||'<p class="mut">Nothing yet.</p>'}`},
mine:()=>{const a=R.filter(r=>r.owner===me.id&&r.status!=='removed'),f=a.filter(r=>tab==='all'||(tab==='lost'&&r.type==='lost')||(tab==='found'&&r.type==='found')||(tab==='active'&&r.status==='active')||(tab==='re'&&r.status==='reunited'));
return `<h2 style="margin-top:26px">My Reports</h2><div class="tabs">${[['all','All'],['lost','My Lost Items'],['found','My Found Items'],['active','Active'],['re','Reunited']].map(t=>`<button class="chip ${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${f.length?f.map(r=>`<div class="card rep"><img src="${r.img}" alt=""><div class="x"><b>${esc(r.title)}</b><div class="meta">${badge(r)} ${esc(r.date)} · ${C.filter(c=>c.rid===r.id&&c.status==='pending').length} pending claims</div></div><button class="btn s sm" onclick="go('item','${r.id}')">Open</button><button class="btn s sm" onclick="editR('${r.id}')">Edit</button>${r.status==='active'?`<button class="btn sm" onclick="reunite('${r.id}')">Mark as Reunited</button>`:''}<button class="btn d sm" onclick="confirmDel('${r.id}')">Delete</button></div>`).join(''):`<div class="empty"><div class="em">📭</div><h3>No reports here yet</h3><p>Lost or found something? Post it in under a minute.</p><button class="btn" onclick="go('report')">Report an Item</button></div>`}
<h3 style="margin-top:24px">My claims</h3>${C.filter(c=>c.by===me.id).map(cview).join('')||'<p class="mut">You haven\'t claimed anything.</p>'}`},
admin:()=>{if(!admin)return '<div class="empty"><div class="em">🔒</div><p>Admins only.</p></div>';const n=s=>R.filter(s).length;return `<h2 style="margin-top:26px">Admin dashboard</h2><div class="stats">${[['Total reports',n(r=>r.status!=='removed')],['Lost',n(r=>r.type==='lost'&&r.status!=='removed')],['Found',n(r=>r.type==='found'&&r.status!=='removed')],['Reunited',n(r=>r.status==='reunited')],['Pending claims',C.filter(c=>c.status==='pending').length]].map(s=>`<div class="card stat"><b>${s[1]}</b><span class="mut">${s[0]}</span></div>`).join('')}</div><h3>All reports</h3><div class="card ov"><table><tr><th>Item</th><th>Type</th><th>Status</th><th>By</th><th></th></tr>${R.slice().sort((a,b)=>b.created-a.created).map(r=>`<tr><td>${esc(r.title)}</td><td>${r.type}</td><td>${r.status}</td><td>${esc(r.ownerName)}</td><td class="row"><button class="btn s sm" onclick="go('item','${r.id}')">View</button><button class="btn d sm" onclick="confirmDel('${r.id}',1)">Remove spam</button></td></tr>`).join('')}</table></div><h3 style="margin-top:20px">Recent activity</h3>${R.slice().sort((a,b)=>b.created-a.created).slice(0,5).map(r=>`<p class="meta">• ${esc(r.ownerName)} reported “${esc(r.title)}” (${r.type})</p>`).join('')}`}};
function cview(c){const r=R.find(x=>x.id===c.rid)||{},own=r.owner===me.id;return `<div class="card" style="padding:14px;margin:10px 0"><div class="row" style="justify-content:space-between"><b>${esc(r.title)} — ${esc(c.byName)}</b><span class="badge ${c.status==='approved'?'found':c.status==='rejected'?'lost':'re'}">${c.status}</span></div><div class="msg">${esc(c.text)}${c.ans?`<br><i>Verification: ${esc(c.ans)}</i>`:''}</div>${(c.msgs||[]).map(m=>`<div class="msg ${m.by===me.id?'me':''}">${esc(m.t)}</div>`).join('')}${c.status==='pending'&&own?`<div class="row"><button class="btn sm" onclick="decide('${c.id}','approved')">Approve</button><button class="btn d sm" onclick="decide('${c.id}','rejected')">Reject</button></div>`:''}<div class="row" style="margin-top:8px"><input id="m-${c.id}" placeholder="Private message…" aria-label="Message" style="flex:1"><button class="btn s sm" onclick="sendM('${c.id}')">Send</button></div></div>`}
async function sendM(id){const i=$('#m-'+id),t=i.value.trim();if(!t)return;const c=C.find(x=>x.id===id);c.msgs=[...(c.msgs||[]),{by:me.id,t}];if(await save('claims',c))toast('Message sent')}
async function decide(id,s){const c=C.find(x=>x.id===id);c.status=s;c.msgs=[...(c.msgs||[]),{by:me.id,t:s==='approved'?'✅ Your claim was approved. Please arrange a safe handover on campus.':'Sorry, your claim was not approved.'}];if(await save('claims',c))toast('Claim '+s+'. Claimant notified.')}
function claim(id){const r=R.find(x=>x.id===id);if(!user&&db){profile();return}const dl=$('#dlg');dl.innerHTML=`<h3>${r.type==='lost'?'I think this is mine':'Contact finder'}</h3><label for="c-t">Why does it belong to you? *</label><textarea id="c-t" rows="3" placeholder="Describe unique marks, contents, where you lost it…"></textarea>${r.q?`<label for="c-a">${esc(r.q)}</label><input id="c-a">`:''}<div class="err" id="c-e"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="sendC('${id}')">Send claim</button><button class="btn o" onclick="dlg.close()">Cancel</button></div>`;dl.showModal()}
async function sendC(id){const t=$('#c-t').value.trim();if(t.length<10){$('#c-e').textContent='Please explain in at least 10 characters.';return}const r=R.find(x=>x.id===id);if(await save('claims',{id:'c'+Date.now(),rid:id,by:me.id,byName:me.name,to:r.owner,text:t,ans:$('#c-a')?.value||'',status:'pending',msgs:[],created:Date.now()})){dlg.close();toast('Claim sent. You will be notified when the reporter responds.')}}
async function reunite(id){const r=R.find(x=>x.id===id);r.status='reunited';if(await save('reports',r))toast('Marked as reunited 🎉')}
function editR(id){edit=R.find(x=>x.id===id);img='';view='report';render()}
function confirmDel(id,spam){const dl=$('#dlg');dl.innerHTML=`<h3>${spam?'Remove this report?':'Delete this report?'}</h3><p class="mut">This can't be undone.</p><div class="row"><button class="btn d" onclick="del('reports','${id}');dlg.close();toast('Report deleted')">Delete</button><button class="btn o" onclick="dlg.close()">Cancel</button></div>`;dl.showModal()}
function hs(){filt.q=$('#hq').value;go('browse')}
function pick(f){if(!f||!f.type.startsWith('image/'))return toast('Please choose an image file',1);const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,520/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.75);$('#drop').innerHTML=`<img src="${img}" alt="Preview">`};im.src=rd.result};rd.readAsDataURL(f)}
async function submitR(ev){ev.preventDefault();const v=i=>$('#f-'+i).value.trim(),er={title:v('title').length<3?'Enter an item name':'',loc:!v('loc')?'Enter a location':'',desc:v('desc').length<10?'Add a few more details (10+ chars)':''};for(const k in er)$('#e-'+k).textContent=er[k];if(Object.values(er).some(Boolean)){toast('Please fix the highlighted fields',1);return false}
 const cat=v('cat'),o={...(edit||{}),id:edit?.id||'r'+Date.now(),title:v('title'),cat,type:v('type'),date:v('date'),loc:v('loc'),desc:v('desc'),q:v('q'),contact:v('contact'),img:img||edit?.img||art(cat),owner:edit?.owner||me.id,ownerName:edit?.ownerName||me.name,status:edit?.status||'active',created:edit?.created||Date.now()};$('#sub').disabled=true;$('#sub').textContent='Saving…';
 if(await save('reports',o)){const e=!!edit;edit=null;img='';view='mine';render();toast(e?'Report updated':'Report submitted. Thank you for helping! 🎉')}else{$('#sub').disabled=false;$('#sub').textContent='Submit report'}return false}
function render(){nav();$('#app').innerHTML=V[view]();if(view==='report'){const dp=$('#drop'),fl=$('#file');fl.onchange=()=>pick(fl.files[0]);['dragover','dragenter'].forEach(n=>dp.addEventListener(n,e=>{e.preventDefault();dp.classList.add('hv')}));['dragleave','drop'].forEach(n=>dp.addEventListener(n,e=>{e.preventDefault();dp.classList.remove('hv')}));dp.addEventListener('drop',e=>pick(e.dataTransfer.files[0]))}}
init();
</script></body></html>
